[package]
name = "photocraft-haiku"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "PhotoCraft native air/OS host"

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
disallowed_methods = "allow"

[[bin]]
name = "PhotoCraft"
path = "src/main.rs"

[dependencies]
photocraft-engine.workspace = true
photocraft-ui-egui.workspace = true
photocraft-io.workspace = true
photocraft-format.workspace = true
photocraft-doc.workspace = true
photocraft-raster.workspace = true
photocraft-codecs.workspace = true
photocraft-text.workspace = true
photocraft-automation.workspace = true
egui.workspace = true
serde_json.workspace = true
log.workspace = true
# The desktop app's logging.rs (shared by path) formats its timestamps with chrono.
chrono.workspace = true
rayon.workspace = true
image = { workspace = true, features = ["png"] }

[target.'cfg(target_os = "haiku")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan"] }
egui-wgpu = { version = "0.37", default-features = false }
# The raw Vulkan device, to import the screen's frame buffer (src/present.rs); the version wgpu-hal uses.
ash = "0.38"
pollster = "1"

[build-dependencies]
cc = "1"
